<!doctype html>
<html lang="ru" data-theme="light">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Freedom CQA · Качество диалогов</title>
  <meta name="description" content="Conversation Quality Analytics — оценка работы операторов по чек-листу, апелляции и пересмотр." />
  <link rel="icon" type="image/svg+xml" href="/img/freedom-shield.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/css/app.css" />
  <script>
    // Host config. In a Dynamics 365 web resource set apiBase to the CQA service URL.
    window.CQA_CONFIG = window.CQA_CONFIG || { apiBase: '' };
    try {
      const t = localStorage.getItem('cqa.theme');
      if (t) document.documentElement.dataset.theme = t;
    } catch {}
  </script>
</head>
<body>
  <div id="cqa-app" class="app">
    <aside class="sidebar" id="sidebar">
      <a class="brand" href="#/" aria-label="Freedom CQA">
        <img class="brand-logo logo-on-light" src="/img/freedom-logo.svg" alt="Freedom" width="126" height="32" />
        <img class="brand-logo logo-on-dark" src="/img/freedom-logo-white.svg" alt="Freedom" width="126" height="32" />
        <span class="brand-product">CQA <small>Контроль качества</small></span>
      </a>
      <nav class="nav" id="nav"></nav>
      <div class="sidebar-foot" id="engine-card"></div>
    </aside>

    <div class="main">
      <header class="topbar">
        <div class="topbar-title">
          <h1 id="page-title">—</h1>
          <span id="page-sub" class="muted"></span>
        </div>
        <div class="topbar-actions">
          <a class="btn btn-sm btn-ghost help-link" href="#/" id="help-link"></a>
          <a class="pill pill-checklist" id="active-checklist" href="#/checklists" title=""></a>
          <div class="seg" id="lang-switch" role="group" aria-label="Language"></div>
          <button class="icon-btn" id="theme-toggle" type="button" aria-label="Theme"></button>
        </div>
      </header>
      <main id="view" class="view" tabindex="-1"></main>
    </div>
  </div>
  <div id="modal-root"></div>
  <div id="toast-root" aria-live="polite"></div>
  <script type="module" src="/js/main.js"></script>
</body>
</html>
