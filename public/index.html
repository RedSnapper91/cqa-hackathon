<!doctype html>
<html lang="ru" data-theme="light">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Freedom CQA · Качество диалогов</title>
  <meta name="description" content="Conversation Quality Analytics — оценка работы операторов по чек-листу, апелляции и пересмотр." />
  <link rel="icon" type="image/svg+xml" href="/img/freedom-shield.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/css/app.css" />
  <script>
    // Host config. In a Dynamics 365 web resource set apiBase to the CQA service URL.
    window.CQA_CONFIG = window.CQA_CONFIG || { apiBase: '' };
    try {
      const t = localStorage.getItem('cqa.theme');
      if (t) document.documentElement.dataset.theme = t;
      if (localStorage.getItem('cqa.sidebar') === 'collapsed') document.documentElement.dataset.sidebar = 'collapsed';
    } catch {}
  </script>
</head>
<body>
  <div id="cqa-app" class="app">
    <aside class="sidebar" id="sidebar" aria-label="Main navigation">
      <a class="sb-brand" href="#/" aria-label="Freedom CQA">
        <img class="brand-logo logo-on-light" src="/img/freedom-logo.svg" alt="Freedom" width="110" height="28" />
        <img class="brand-logo logo-on-dark" src="/img/freedom-logo-white.svg" alt="Freedom" width="110" height="28" />
        <img class="brand-mark" src="/img/freedom-shield.svg" alt="Freedom" width="26" height="28" />
      </a>
      <div class="sb-product" id="brand-product"></div>
      <nav class="nav" id="nav"></nav>
      <div class="sb-foot" id="engine-card"></div>
    </aside>
    <div class="sb-backdrop" id="sb-backdrop"></div>
    <div class="main">
      <header class="topbar">
        <button class="icon-btn sb-toggle" id="sb-toggle" type="button" aria-controls="sidebar"></button>
        <div class="crumbs" id="crumbs"></div>
        <div class="header-actions">
          <div class="lang" id="lang-switch" role="group" aria-label="Language"></div>
          <button class="icon-btn" id="theme-toggle" type="button" aria-label="Theme"></button>
        </div>
      </header>
      <main class="wrap page">
        <div class="page-head" id="page-head">
          <div><h1 id="page-title"></h1><p id="page-sub"></p></div>
          <div class="ph-actions" id="page-actions"></div>
        </div>
        <div id="view" class="view" tabindex="-1"></div>
      </main>
    </div>
  </div>
  <div id="modal-root"></div>
  <div id="toast-root" aria-live="polite"></div>
  <script type="module" src="/js/main.js"></script>
</body>
</html>
